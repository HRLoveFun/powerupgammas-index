<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerUpGammas · 视频索引</title>
<style>:root{
  --bg:#0a0b0d;
  --bg2:#0e1013;
  --surface:#121417;
  --surface2:#171a1e;
  --line:#22262c;
  --line2:#2c3138;
  --text:#e9e7e3;
  --text2:#a8adb6;
  --muted:#767d88;
  --gold:#c9a227;
  --blue:#5b9cf8;
  --violet:#9b7cf0;
  --amber:#e0a34a;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --gutter:104px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 520px at 12% -8%,rgba(201,162,39,.055),transparent 62%),
             radial-gradient(900px 460px at 92% 0%,rgba(91,156,248,.045),transparent 60%);
}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 32px 80px}

/* ---------- sticky head ---------- */
.stickyhead{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(10,11,13,.97) 0%,rgba(10,11,13,.93) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  margin:0 -32px;padding:0 32px;
}
.head{display:flex;align-items:center;gap:16px;height:54px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.ch{
  color:var(--text);text-decoration:none;font-size:16.5px;font-weight:650;
  letter-spacing:.2px;
}
.ch:hover{color:var(--gold)}
.sub{font-size:12px;color:var(--muted);letter-spacing:.14em}
.headmeta{
  margin-left:auto;display:flex;gap:0;align-items:center;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;
}
.headmeta b{color:var(--text2);font-weight:500}
.headmeta i{font-style:normal;opacity:.45;margin:0 9px}
.tools{display:flex;align-items:center;gap:8px;margin-left:16px}
.search{
  display:flex;align-items:center;gap:7px;padding:0 9px;height:27px;
  border:1px solid var(--line);border-radius:7px;background:var(--bg2);color:var(--muted);
  transition:border-color .16s,color .16s;
}
.search:focus-within{border-color:var(--line2);color:var(--text2)}
.search input{
  width:132px;background:none;border:0;outline:0;color:var(--text);
  font-family:var(--sans);font-size:12.5px;
}
.search input::placeholder{color:#5d646e}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}

button.ghost{
  height:27px;padding:0 10px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg2);color:var(--text2);
  font-family:var(--sans);font-size:12px;transition:.16s;
}
button.ghost:hover{border-color:var(--line2);color:var(--text)}
button.ghost.on{background:rgba(201,162,39,.13);border-color:rgba(201,162,39,.5);color:#e6c65c}
button.ghost.sm{height:24px;padding:0 9px;font-size:11.5px}
button.ghost .cnt{
  display:inline-block;margin-left:5px;font-family:var(--mono);font-size:10.5px;
  color:#e6c65c;opacity:.9;
}

/* ---------- tag bar ---------- */
.tagbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:5px;
  padding:0 0 10px;
}
.tag{
  --tc:#8b95a3;
  display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 8px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg2);
  color:var(--text2);font-size:11.5px;cursor:pointer;transition:.14s;white-space:nowrap;
}
.tag:hover{border-color:var(--line2);color:var(--text)}
.tag .n{font-family:var(--mono);font-size:10px;color:#6b727d}
.tag .sw{width:6px;height:6px;border-radius:50%;background:var(--tc);opacity:.85}
.tag.all{font-weight:550}
.tag.on{
  background:color-mix(in srgb,var(--tc) 17%,transparent);
  border-color:color-mix(in srgb,var(--tc) 62%,transparent);
  color:color-mix(in srgb,var(--tc) 46%,#fff);
}
.tag.on .n{color:inherit;opacity:.6}
.tag.all.on{--tc:var(--gold)}
.tagbar .dvd{width:1px;height:16px;background:var(--line);margin:0 5px}

/* ---------- legend ---------- */
.legend{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:11px 0 5px;font-size:11px;color:var(--muted);
}
.lg{display:inline-flex;align-items:center;gap:7px}
.lg em{font-style:normal;color:#5f6670}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.mention{background:transparent;border:1.5px solid var(--blue)}
.fbox{
  width:15px;height:10px;border-radius:3px;display:inline-block;
  border:1px solid rgba(155,124,240,.62);background:rgba(155,124,240,.1);
}
.hint{margin-left:auto;color:#6b7280}
.lg.dim{color:#6b7280;font-size:11px}

/* ---------- board ---------- */
.board{position:relative;border-top:1px solid var(--line)}
.cols{
  display:grid;grid-template-columns:86px minmax(0,1fr) 96px;
  padding:6px 0 6px 12px;margin-right:var(--gutter);
  font-size:9.5px;letter-spacing:.14em;color:#5c636d;text-transform:uppercase;
  border-bottom:1px solid var(--line);
}
.cols .c-refs{text-align:right;padding-right:2px}
.list{position:relative;padding-right:var(--gutter)}

.row{
  scroll-margin-top:132px;
  display:grid;grid-template-columns:86px minmax(0,1fr) 96px;
  align-items:center;min-height:33px;padding:0 0 0 12px;
  border-bottom:1px solid #171a1e;position:relative;
  transition:background .14s;
}
.row:not(.hidden):hover{background:#111418}
.row.hidden{display:none}
.row .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.5}
.row:hover .stripe{opacity:.85}
.c-title{min-width:0;padding-right:12px}
.c-title a{
  color:#dcd9d4;text-decoration:none;font-size:13px;line-height:1.32;
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color .14s;
}
.row:hover .c-title a{color:#fff}
.c-title a:hover{color:var(--gold)}
.c-date{
  font-family:var(--mono);font-size:10.5px;color:#6f7680;
  font-variant-numeric:tabular-nums;
}
.c-refs{display:flex;gap:7px;justify-content:flex-end;align-items:center;padding-right:0;flex-wrap:wrap}

.badge{
  width:10px;height:10px;min-width:10px;border-radius:50%;cursor:pointer;
  padding:0;background:transparent;position:relative;transition:.14s;
}
.badge::after{content:"";position:absolute;inset:-7px;border-radius:50%}
.badge.mention{border:1px solid rgba(91,156,248,.62)}
.badge.series{border:1px solid rgba(155,124,240,.7);position:relative}
.badge.series::before{
  content:"";position:absolute;inset:2px;border-radius:50%;
  border:1px solid rgba(155,124,240,.5);
}
.badge:hover{border-color:var(--blue);background:rgba(91,156,248,.3);transform:scale(1.28)}
.badge.series:hover{border-color:var(--violet);background:rgba(155,124,240,.3)}
.badge.sel{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,156,248,.14)}
.badge.series.sel{background:var(--violet);border-color:var(--violet);box-shadow:0 0 0 3px rgba(155,124,240,.16)}

.penbtn{
  display:none;height:18px;padding:0 6px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(201,162,39,.45);background:rgba(201,162,39,.1);
  color:#dcc06a;font-size:10px;font-family:var(--sans);
}
.mode-edit .penbtn{display:inline-flex;align-items:center}
.mode-edit .c-refs{flex-wrap:nowrap;gap:6px}

/* row states */
.row.is-source{background:rgba(201,162,39,.07)}
.row.is-source .stripe{opacity:1;background:var(--gold)!important}
.row.is-target{background:rgba(91,156,248,.1)}
.row.is-target .c-title a{color:#fff}
.row.is-temp .c-date::after{
  content:"临时";margin-left:7px;font-size:9.5px;color:var(--amber);
  border:1px solid rgba(224,163,74,.4);border-radius:3px;padding:0 3px;
  font-family:var(--sans);letter-spacing:.04em;
}
.row.is-target::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--blue);
}
.row.flash{animation:flash .9s ease-out}
@keyframes flash{0%{background:rgba(91,156,248,.28)}100%{background:rgba(91,156,248,.1)}}

/* year divider */
.yr{
  display:flex;align-items:center;gap:10px;
  padding:15px 0 5px 12px;margin-right:var(--gutter);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:#5b636d;
}
.yr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#1d2126,transparent)}
.yr.hidden{display:none}

/* links svg */
.links{
  position:absolute;top:0;right:0;width:var(--gutter);height:100%;
  pointer-events:none;overflow:visible;z-index:2;
}
.frames{
  position:absolute;top:0;left:0;width:calc(100% - var(--gutter));height:100%;
  pointer-events:none;overflow:visible;z-index:2;
}
.links path{
  fill:none;stroke-width:1.1;
  animation:draw .34s cubic-bezier(.3,.7,.3,1);
}
@keyframes draw{from{opacity:0;stroke-dasharray:0 400}to{opacity:1}}

/* ---------- editor ---------- */
.row.editing{background:#101317}
.editor{
  grid-column:1/-1;padding:2px 0 16px 40px;display:flex;flex-direction:column;gap:12px;
  animation:fade .18s ease-out;
}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.ed-row{display:flex;align-items:flex-start;gap:10px}
.ed-label{
  width:52px;flex:none;font-size:10.5px;letter-spacing:.1em;color:#5f6670;
  padding-top:5px;text-transform:uppercase;
}
.ed-body{display:flex;flex-wrap:wrap;gap:5px;align-items:center;flex:1}
.tag.mini{height:22px;font-size:11px;padding:0 8px}
.tag.mini.on{font-weight:500}
.refitem .rdot{
  width:8px;height:8px;border-radius:50%;flex:none;
  border:1px solid rgba(91,156,248,.65);
}
.refitem.series .rdot{border-color:rgba(155,124,240,.75);box-shadow:inset 0 0 0 1px rgba(155,124,240,.45)}
.editor button.ghost{border-color:#2c3138;background:#15181c}
.refitem{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 4px 0 7px;
  border-radius:11px;border:1px solid var(--line2);background:#15181c;
  font-size:11px;color:var(--text2);
}
.refitem .x{
  cursor:pointer;color:#6b7280;font-size:13px;line-height:1;padding:0 3px;
}
.refitem .x:hover{color:#e07070}
.refitem.series{border-style:dashed}
.refinput{
  height:26px;min-width:190px;padding:0 9px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg2);color:var(--text);
  font-family:var(--sans);font-size:12px;outline:0;
}
.refinput:focus{border-color:var(--line2)}
.sug{
  position:absolute;z-index:50;background:#15181c;border:1px solid var(--line2);
  border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.55);max-height:230px;
  overflow:auto;padding:4px;min-width:280px;
}
.sug div{
  padding:6px 9px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sug div:hover,.sug div.cur{background:#1d2228;color:#fff}
.sug .sug-d{font-family:var(--mono);font-size:10px;color:#5a616b;margin-right:8px}

/* ---------- drawer ---------- */
.drawer{
  position:fixed;right:24px;bottom:24px;width:452px;max-width:calc(100vw - 48px);
  max-height:min(64vh,560px);z-index:60;display:flex;flex-direction:column;
  background:#0f1215;border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.drawer-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--line);font-size:12.5px;
}
.drawer-sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.drawer-head button{margin-left:auto}
.drawer-body{overflow:auto;padding:8px 14px 14px}
.pi-intro{
  margin:8px 0 4px;padding:11px 13px;border-radius:8px;
  background:#0d1013;border:1px solid #1c2026;
  font-size:11.5px;line-height:1.68;color:#98a0aa;
}
.pi-intro p{margin:0 0 7px}
.pi-intro p:last-child{margin:0}
.pi-intro em{font-style:normal;color:#c6c2ba}
.pi-intro b{color:#d8d4cc;font-weight:600}
.pi-intro ul{margin:7px 0 8px;padding-left:0;list-style:none}
.pi-intro li{position:relative;padding-left:12px;margin-bottom:4px}
.pi-intro li::before{
  content:"";position:absolute;left:2px;top:.72em;width:3px;height:3px;
  border-radius:50%;background:#4a515b;
}
.pi-intro .dim{color:#6b7280;font-size:11px;margin-top:8px}
.pi-empty{
  padding:18px 0 22px;text-align:center;color:#5f6670;font-size:12px;
}
.pi{padding:11px 0;border-bottom:1px solid #191c21}
.pi:last-child{border-bottom:0}
.pi-t{font-size:12.5px;color:#d5d2cd;margin-bottom:3px}
.pi-t a{color:inherit;text-decoration:none}
.pi-t a:hover{color:var(--gold)}
.pi-m{font-family:var(--mono);font-size:10.5px;color:#5f6670;margin-bottom:5px}
.pi-e{
  font-size:11.5px;color:#9aa1ab;line-height:1.55;background:#12151a;
  border-left:2px solid #2a2f36;padding:6px 9px;border-radius:0 4px 4px 0;margin-bottom:7px;
}
.pi-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pi-a select{
  height:24px;background:var(--bg2);color:var(--text2);border:1px solid var(--line);
  border-radius:5px;font-size:11.5px;max-width:230px;font-family:var(--sans);
}

/* ---------- footer / toast ---------- */
.foot{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:22px 0 0;font-size:11.5px;color:#5f6670;
}
.foot .sep{opacity:.5}
.foot code{font-family:var(--mono);font-size:11px;color:#7d848e}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:#1a1e23;border:1px solid var(--line2);color:var(--text);
  padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:80;
  box-shadow:0 14px 40px rgba(0,0,0,.55);
  animation:fade .2s ease-out;
}

@media (max-width:860px){
  .wrap{padding:0 16px 60px}
  .stickyhead{margin:0 -16px;padding:0 16px}
  .head{height:auto;padding:10px 0;flex-wrap:wrap;gap:10px}
  .headmeta{order:3;width:100%;margin-left:0}
  .tools{margin-left:auto}
  .cols,.row{grid-template-columns:62px minmax(0,1fr) 76px}
  .list{padding-right:0}
  .links{display:none}
  .frames{width:100%}
  .cols{margin-right:0}
  .yr{margin-right:0}
  .c-date{font-size:10.5px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="stickyhead">
    <div class="head">
      <div class="brand">
        <a class="ch" href="https://www.youtube.com/@PowerUpGammas" target="_blank" rel="noopener">PowerUpGammas</a>
        <span class="sub">视频索引</span>
      </div>
      <div class="headmeta" id="headmeta"></div>
      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="6.8" cy="6.8" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="搜索标题" autocomplete="off">
        </label>
        <button id="btnPending" class="ghost" hidden></button>
        <button id="btnExport" class="ghost" hidden></button>
        <button id="btnReset" class="ghost" hidden>重置</button>
        <button id="btnEdit" class="ghost">维护</button>
      </div>
    </div>
    <nav class="tagbar" id="tagbar" aria-label="标签筛选"></nav>
  </header>

  <div class="legend">
    <span class="lg"><i class="dot mention"></i>明确引用<em>点圆点展开该行全部引用</em></span>
    <span class="lg"><i class="fbox"></i>系列关联<em>同系列的连续几期用方框圈出</em></span>
    <span class="lg hint" id="selhint"></span>
  </div>

  <section class="board">
    <div class="cols">
      <div class="c-date">发布日期</div>
      <div class="c-title">视频名称</div>
      <div class="c-refs">引用</div>
    </div>
    <div class="list" id="list">
      <svg class="links" id="links" aria-hidden="true"></svg>
      <svg class="frames" id="frames" aria-hidden="true"></svg>
    </div>
  </section>

  <footer class="foot">
    <span id="footstat"></span>
    <span class="sep">·</span>
    <span>标签来自频道播放列表；引用按简介链接与系列结构推断，人工修订见 <code>data/manual.json</code></span>
  </footer>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <strong>待确认的提及</strong>
      <span class="drawer-sub" id="drawerSub"></span>
      <button class="ghost sm" id="drawerClose">关闭</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>

-YZW7SVqhp6sfxF1pQJCe","label":"交易软件应用","full":"交易软件应用 | Software Hack","color":"#cf8f6a","source":"playlist"},{"id":"PLFzeuKbRQ3c0mogNzNPUo2Pxnvfpkgu8V","label":"期权的重要思想","full":"期权的重要思想 | Option the Smart","color":"#c9a227","source":"playlist"},{"id":"PLFzeuKbRQ3c1Scw3lQv8Einmv2L_H-yJR","label":"美股市场和 ETF","full":"美股市场和 ETF | US Stocks & ETFs","color":"#5b9cf8","source":"playlist"},{"id":"PLFzeuKbRQ3c2xUmsl8VZTZiBuB6iV-F87","label":"其他金融市场内容","full":"其他金融市场内容 | Other Goodies","color":"#7fbf7f","source":"playlist"},{"id":"unfiled","label":"未归类","full":"未收录进任何播放列表","color":"#5a626e","source":"system"}],"pending":[{"videoId":"oXjxx5jH2gw","phrase":"承接","evidence":"…做空股票蕴含巨大风险。本视频承接之前的内容，深入探讨了逼空形成的根本原因，以及交易者是否有机会利用这个特殊的市场现象。…"}]};
window.__MANUAL__ = {"_comment":"人工维护覆盖层。以 YouTube 视频 ID 为索引，构建时与自动数据合并，自动更新不会覆盖本文件。","_schema":{"tags":"{videoId: {add: [tagId], remove: [tagId]}}  手工增删标签","refs":"{videoId: {add: [{to, type, note}], remove: [targetVideoId]}}  手工增删引用；type 取值 mention|series","tagDefs":"[{id, label, color}]  新增自定义标签","pendingDismissed":"[videoId]  已审阅并忽略的待确认提及"},"tags":{},"refs":{},"tagDefs":[],"pendingDismissed":[]};</script>
<script>(function () {
  "use strict";

  const DATA = window.__DATA__;
  const $ = (s, r) => (r || document).querySelector(s);
  const el = (tag, cls, txt) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  };
  const pad2 = (n) => String(n).padStart(2, "0");
  const LSKEY = "pug.manual.v1";

  const S = {
    videos: DATA.videos.slice(),
    byId: {},
    tagById: {},
    pending: DATA.pending.slice(),
    sel: new Set(),
    search: "",
    active: new Set(),    // 已展开的行（视频 id）
    edit: false,
    openEditor: null,
    manual: loadManual(),
    rows: {},
    years: [],
    dirty: false,
  };

  DATA.videos.forEach((v) => (S.byId[v.id] = v));
  DATA.tags.forEach((t) => (S.tagById[t.id] = t));

  /* ---------------- manual overlay ---------------- */
  function emptyManual() {
    return { tags: {}, refs: {}, tagDefs: [], pendingDismissed: [] };
  }
  function loadManual() {
    try {
      const raw = localStorage.getItem(LSKEY);
      if (raw) {
        const o = JSON.parse(raw);
        return Object.assign(emptyManual(), o);
      }
    } catch (e) {}
    return window.__MANUAL__ ? JSON.parse(JSON.stringify(window.__MANUAL__)) : emptyManual();
  }
  const hasLocal = () => {
    try { return !!localStorage.getItem(LSKEY); } catch (e) { return false; }
  };

  function mergeTags(v) {
    const rule = S.manual.tags[v.id] || {};
    const rm = rule.remove || [], ad = rule.add || [];
    let out = (v.autoTags || []).filter((t) => rm.indexOf(t) < 0);
    ad.forEach((t) => {
      if (S.tagById[t] && out.indexOf(t) < 0) out.push(t);
    });
    const hasPlaylist = out.some((t) => S.tagById[t] && S.tagById[t].source === "playlist");
    out = out.filter((t) => t !== "unfiled");
    if (!hasPlaylist) out.push("unfiled");
    return out;
  }

  function mergeRefs(v) {
    const rule = S.manual.refs[v.id] || {};
    const rm = rule.remove || [], ad = rule.add || [];
    let out = (v.autoRefs || []).filter((r) => rm.indexOf(r.to) < 0).slice();
    const seen = new Set(out.map((r) => r.to));
    ad.forEach((r) => {
      if (r.to === v.id || seen.has(r.to) || !S.byId[r.to]) return;
      out.push({ to: r.to, n: S.byId[r.to].n, type: r.type || "mention", note: r.note || "" });
      seen.add(r.to);
    });
    out.sort((a, b) => a.n - b.n);
    return out;
  }

  function recompute() {
    S.videos.forEach((v) => {
      v.tags = mergeTags(v);
      v.refs = mergeRefs(v);
    });
  }

  // 可见内容的真实高度：绝对定位的 SVG 会撑大 scrollHeight，不能拿它当基准
  function listContentHeight() {
    let h = 0;
    S.videos.forEach((v) => {
      const r = S.rows[v.id];
      if (r && !r.classList.contains("hidden")) h = Math.max(h, r.offsetTop + r.offsetHeight);
    });
    return h;
  }

  /* ---------------- header ---------------- */
  function renderHead() {
    const vids = S.videos;
    const first = vids[vids.length - 1].date, last = vids[0].date;
    const edges = vids.reduce((a, v) => a + v.refs.length, 0);
    $("#headmeta").innerHTML =
      "<b>" + S.videos.length + "</b> 期<i>/</i>" + first.slice(0, 4) + "–" + last.slice(0, 4) +
      "<i>/</i><b>" + edges + "</b> 条关联";
    $("#footstat").textContent =
      "排序：发布日期从新到旧 · 共 " + S.videos.length + " 个公开视频 · 生成于 " + DATA.generatedAt;
  }

  /* ---------------- tags ---------------- */
  function renderTags() {
    const bar = $("#tagbar");
    bar.textContent = "";
    const all = el("button", "tag all" + (S.sel.size === 0 ? " on" : ""));
    all.innerHTML = "全部";
    all.onclick = () => { S.sel.clear(); S.active.clear(); renderTags(); applyFilter(); };
    bar.appendChild(all);

    const groups = [
      DATA.tags.filter((t) => t.source === "playlist"),
      DATA.tags.filter((t) => t.source === "manual"),
      DATA.tags.filter((t) => t.source === "system"),
    ];
    groups.forEach((g) => {
      if (!g.length) return;
      if (g[0].source !== "playlist") {
        const d = el("span", "dvd");
        bar.appendChild(d);
      }
      g.forEach((t) => {
        const n = S.videos.filter((v) => v.tags.indexOf(t.id) >= 0).length;
        if (!n) return;
        const b = el("button", "tag" + (S.sel.has(t.id) ? " on" : ""));
        b.style.setProperty("--tc", t.color);
        b.title = t.full + "（" + n + " 期）";
        b.setAttribute("aria-pressed", S.sel.has(t.id) ? "true" : "false");
        const sw = el("span", "sw");
        const lb = el("span", null, t.label);
        const nn = el("span", "n", n);
        b.append(sw, lb, nn);
        b.onclick = () => {
          if (S.sel.has(t.id)) S.sel.delete(t.id); else S.sel.add(t.id);
          S.active.clear();
          renderTags(); applyFilter();
        };
        bar.appendChild(b);
      });
    });
    updateHint();
  }

  function updateHint() {
    const h = $("#selhint");
    if (!S.sel.size) { h.textContent = ""; return; }
    h.textContent = "已选 " + S.sel.size + " 个标签（取并集）";
  }

  /* ---------------- list ---------------- */
  function renderList() {
    const list = $("#list");
    const svg = $("#links");
    [...list.querySelectorAll(".row,.yr")].forEach((n) => n.remove());
    S.rows = {}; S.years = [];

    let curYear = null;
    S.videos.forEach((v) => {
      const y = v.date.slice(0, 4);
      if (y !== curYear) {
        curYear = y;
        const d = el("div", "yr", y);
        list.appendChild(d);
        S.years.push({ el: d, year: y });
      }
      const row = el("div", "row");
      row.dataset.id = v.id;
      row.dataset.n = v.n;

      const stripe = el("span", "stripe");
      row.appendChild(stripe);

      row.appendChild(el("div", "c-date", v.date));

      const ct = el("div", "c-title");
      const a = el("a", null, v.title);
      a.href = "https://www.youtube.com/watch?v=" + v.id;
      a.target = "_blank"; a.rel = "noopener";
      a.title = v.title;
      ct.appendChild(a);
      row.appendChild(ct);

      const cr = el("div", "c-refs");
      row.appendChild(cr);

      row.addEventListener("click", (ev) => {
        if (ev.target.closest("a,.badge")) return;
        if (!S.edit) return;
        toggleEditor(v.id);
      });

      list.appendChild(row);
      S.rows[v.id] = row;
    });
    paintRows();
    svg.style.height = listContentHeight() + "px";
  }

  function paintRows() {
    S.videos.forEach((v) => {
      const row = S.rows[v.id];
      if (!row) return;
      const cols = v.tags.map((t) => (S.tagById[t] ? S.tagById[t].color : "#5a626e"));
      const stripe = row.querySelector(".stripe");
      if (!cols.length) {
        stripe.style.background = "transparent";
      } else if (cols.length === 1) {
        stripe.style.background = cols[0];
      } else {
        const step = 100 / cols.length;
        stripe.style.background = "linear-gradient(to bottom," +
          cols.map((c, i) => c + " " + (i * step).toFixed(1) + "%," + c + " " + ((i + 1) * step).toFixed(1) + "%").join(",") + ")";
      }
      row.title = v.tags.map((t) => (S.tagById[t] ? S.tagById[t].label : t)).join(" · ");

      const cr = row.querySelector(".c-refs");
      cr.textContent = "";
      const mentions = mentionTargets(v);
      if (mentions.length) {
        const b = el("button", "badge mention");
        b.dataset.from = v.id;
        if (mentions.length === 1) {
          const t = S.byId[mentions[0].to], r = mentions[0];
          const why = r.label ? "简介链接：" + r.label : "明确引用：";
          b.title = why + "\n→ " + t.title + "（" + t.date + "）\n点击高亮并连线";
        } else {
          const lines = mentions.slice(0, 4).map((r) => "· " + S.byId[r.to].title).join("\n");
          const more = mentions.length > 4 ? "\n… 共 " + mentions.length + " 个" : "";
          b.title = "明确引用 " + mentions.length + " 个视频\n" + lines + more + "\n点击一并高亮并连线";
        }
        b.setAttribute("aria-label", "查看该行引用");
        b.onclick = (ev) => { ev.stopPropagation(); toggleSource(v.id); };
        cr.appendChild(b);
      }
      const pen = el("button", "penbtn", "编辑");
      pen.onclick = (ev) => { ev.stopPropagation(); toggleEditor(v.id); };
      cr.appendChild(pen);
    });
  }

  /* ---------------- filtering ---------------- */
  function matches(v) {
    if (S.search && v.title.toLowerCase().indexOf(S.search) < 0) return false;
    if (!S.sel.size) return true;
    return v.tags.some((t) => S.sel.has(t));
  }

  function applyFilter() {
    const forced = new Set();
    S.active.forEach((id) => (S.byId[id] ? mentionTargets(S.byId[id]) : []).forEach((r) => forced.add(r.to)));
    const yearOn = {};
    let shown = 0;
    S.videos.forEach((v) => {
      const ok = matches(v);
      const show = ok || forced.has(v.id);
      const row = S.rows[v.id];
      row.classList.toggle("hidden", !show);
      row.classList.toggle("is-temp", show && !ok);
      if (show) { shown++; yearOn[v.date.slice(0, 4)] = true; }
    });
    S.years.forEach((y) => y.el.classList.toggle("hidden", !yearOn[y.year]));
    $("#footstat").textContent =
      (S.sel.size || S.search ? "筛选后 " + shown + " / " + S.videos.length + " 期" :
        "排序：发布日期从新到旧 · 共 " + S.videos.length + " 个公开视频") + " · 生成于 " + DATA.generatedAt;
    markActive();
    drawFrames();
    drawLinks();
  }

  /* ---------------- references & lines ---------------- */
  function sameSeries(a, b) {
    return !!a.series && a.series === b.series;
  }

  // 圆点只表示「跨系列的明确引用」；同系列内部的关系由方框表达
  function mentionTargets(v) {
    return (v.refs || []).filter((r) => r.type !== "series" && !sameSeries(v, S.byId[r.to]));
  }

  function toggleSource(id) {
    const v = S.byId[id];
    if (!v || !mentionTargets(v).length) return;
    const on = !S.active.has(id);
    if (on) S.active.add(id); else S.active.delete(id);
    applyFilter();
    if (!on) return;

    // 把第一个目标行带进视野
    const ms = mentionTargets(v);
    const first = S.rows[ms[0].to];
    if (!first) return;
    const r = first.getBoundingClientRect();
    if (r.top < 140 || r.bottom > window.innerHeight - 16) {
      first.scrollIntoView({ block: "center", behavior: "smooth" });
    }
    ms.forEach((ref) => {
      const row = S.rows[ref.to];
      if (!row) return;
      row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
    });
  }

  function markActive() {
    Object.values(S.rows).forEach((r) => r.classList.remove("is-source", "is-target"));
    document.querySelectorAll(".badge.sel").forEach((b) => b.classList.remove("sel"));
    S.active.forEach((id) => {
      const v = S.byId[id], row = S.rows[id];
      if (!v || !row) return;
      row.classList.add("is-source");
      mentionTargets(v).forEach((r) => { if (S.rows[r.to]) S.rows[r.to].classList.add("is-target"); });
      const dot = row.querySelector(".badge");
      if (dot) dot.classList.add("sel");
    });
  }

  const SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  function drawLinks() {
    const svg = $("#links");
    svg.textContent = "";
    const list = $("#list");
    const H = listContentHeight();
    svg.style.height = H + "px";
    if (!S.active.size) return;

    const defs = svgEl("defs", {});
    [["arw-m", "#5b9cf8"], ["arw-s", "#9b7cf0"]].forEach(([id, c]) => {
      const m = svgEl("marker", {
        id: id, viewBox: "0 0 8 8", refX: "7", refY: "4",
        markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse",
      });
      m.appendChild(svgEl("path", { d: "M0,0.6 L7,4 L0,7.4 z", fill: c }));
      defs.appendChild(m);
    });
    svg.appendChild(defs);

    const lr = list.getBoundingClientRect();
    const gutter = parseFloat(getComputedStyle(list).paddingRight) || 104;
    const edgeX = lr.right - gutter;          // 行右边缘 = SVG 左边缘
    const order = Array.from(S.active)
      .filter((id) => S.rows[id] && !S.rows[id].classList.contains("hidden"))
      .sort((a, b) => S.rows[a].offsetTop - S.rows[b].offsetTop);

    let ei = 0;
    order.forEach((id) => {
      const a = S.rows[id], v = S.byId[id];
      const ms = mentionTargets(v);
      const n = ms.length;
      let k = 0;
      ms.forEach((r) => {
        const b = S.rows[r.to];
        if (!b || b.classList.contains("hidden")) return;
        const y2 = b.offsetTop + b.offsetHeight / 2;
        const shift = n > 1 ? (k - (n - 1) / 2) * 3.2 : 0;
        const y1 = a.offsetTop + a.offsetHeight / 2 + shift;
        const bow = 26 + (ei % 6) * 12;
        const isSeries = r.type === "series";
        const p = svgEl("path", {
          d: "M1," + y1 + " C" + bow + "," + y1 + " " + bow + "," + y2 + " 2," + y2,
          stroke: isSeries ? "#9b7cf0" : "#5b9cf8",
          "stroke-opacity": isSeries ? ".7" : ".88",
          "stroke-width": "1.25",
          "stroke-dasharray": isSeries ? "3 3" : "none",
          "marker-end": "url(#" + (isSeries ? "arw-s" : "arw-m") + ")",
        });
        svg.appendChild(p);
        k++; ei++;
      });
    });
  }

  /* ---------------- 系列方框 ---------------- */
  function drawFrames() {
    const svg = $("#frames");
    if (!svg) return;
    svg.textContent = "";
    const list = $("#list");
    svg.style.height = listContentHeight() + "px";

    // 按系列名归组：标题结构决定的成员关系，与引用类型无关
    const groups = new Map();
    S.videos.forEach((v) => {
      if (!v.series) return;
      if (!groups.has(v.series)) groups.set(v.series, []);
      groups.get(v.series).push(v.id);
    });
    if (!groups.size) return;

    const W = svg.getBoundingClientRect().width || list.clientWidth;

    groups.forEach((ids, name) => {
      const rows = ids
        .map((id) => S.rows[id])
        .filter((r) => r && !r.classList.contains("hidden"))
        .sort((a, b) => a.offsetTop - b.offsetTop);
      if (rows.length < 2) return;

      // 简介里互相列过链接的同系列视频，在提示里点出来
      const linked = ids.some((id) => {
        const v = S.byId[id];
        return v && v.refs.some((r) => r.type === "mention" && sameSeries(v, S.byId[r.to]));
      });

      const runs = [];
      let run = [rows[0]];
      for (let i = 1; i < rows.length; i++) {
        const prev = run[run.length - 1];
        if (rows[i].offsetTop <= prev.offsetTop + prev.offsetHeight + 2) run.push(rows[i]);
        else { runs.push(run); run = [rows[i]]; }
      }
      runs.push(run);

      const g = svgEl("g", {});
      const t = document.createElementNS(SVGNS, "title");
      t.textContent = "系列：" + name + "（共 " + ids.length + " 期" + (linked ? "，简介中互有链接" : "") + "）";
      g.appendChild(t);

      const boxes = runs.map((seg) => {
        const last = seg[seg.length - 1];
        const top = seg[0].offsetTop + 1.5;
        const bottom = last.offsetTop + last.offsetHeight - 1.5;
        return { top: top, bottom: bottom };
      });

      // 被非系列视频隔开的段落：用虚线把同一组串起来
      if (boxes.length > 1) {
        for (let i = 0; i < boxes.length - 1; i++) {
          g.appendChild(svgEl("path", {
            d: "M" + (W + 8) + "," + boxes[i].bottom + " L" + (W + 8) + "," + boxes[i + 1].top,
            stroke: "rgba(155,124,240,.5)", "stroke-width": "1",
            "stroke-dasharray": "2 4", fill: "none",
          }));
        }
      }
      boxes.forEach((b) => {
        g.appendChild(svgEl("rect", {
          x: 2.5, y: b.top, width: Math.max(0, W - 5), height: Math.max(0, b.bottom - b.top),
          rx: 9, ry: 9,
          fill: "rgba(155,124,240,.05)",
          stroke: "rgba(155,124,240,.34)",
          "stroke-width": "1",
        }));
      });
      svg.appendChild(g);
    });
  }

  /* ---------------- editor ---------------- */
  function toggleEditor(id) {
    if (S.openEditor && S.openEditor !== id) closeEditor(S.openEditor);
    if (S.openEditor === id) { closeEditor(id); return; }
    S.openEditor = id;
    const row = S.rows[id];
    row.classList.add("editing");
    const ed = el("div", "editor");
    ed.dataset.for = id;
    buildEditor(ed, S.byId[id]);
    row.appendChild(ed);
    svgResize();
  }

  function closeEditor(id) {
    const row = S.rows[id];
    if (!row) return;
    row.classList.remove("editing");
    const ed = row.querySelector(".editor");
    if (ed) ed.remove();
    if (S.openEditor === id) S.openEditor = null;
    svgResize();
  }

  function svgResize() {
    const h = listContentHeight();
    $("#links").style.height = h + "px";
    if ($("#frames")) $("#frames").style.height = h + "px";
    drawFrames();
    drawLinks();
  }

  function buildEditor(box, v) {
    box.textContent = "";

    // 标签
    const r1 = el("div", "ed-row");
    r1.appendChild(el("div", "ed-label", "标签"));
    const b1 = el("div", "ed-body");
    DATA.tags.filter((t) => t.source !== "system").forEach((t) => {
      const on = v.tags.indexOf(t.id) >= 0;
      const c = el("button", "tag mini" + (on ? " on" : ""));
      c.style.setProperty("--tc", t.color);
      const sw = el("span", "sw");
      c.append(sw, el("span", null, t.label));
      c.onclick = (ev) => {
        ev.stopPropagation();
        setTag(v.id, t.id, !on);
        buildEditor(box, S.byId[v.id]);
        paintRows(); applyFilter();
      };
      b1.appendChild(c);
    });
    r1.appendChild(b1);
    box.appendChild(r1);

    // 引用
    const r2 = el("div", "ed-row");
    r2.appendChild(el("div", "ed-label", "引用"));
    const b2 = el("div", "ed-body");
    const editRefs = mentionTargets(v);
    const seriesOnly = v.refs.length - editRefs.length;
    if (!editRefs.length) b2.appendChild(el("span", "lg", "暂无跨系列的明确引用"));
    editRefs.forEach((r) => {
      const chip = el("span", "refitem" + (r.type === "series" ? " series" : ""));
      chip.appendChild(el("span", "rdot"));
      const t = S.byId[r.to].title;
      chip.title = t;
      const short = t.length > 18 ? t.slice(0, 18) + "…" : t;
      chip.appendChild(el("span", null, short));
      const x = el("span", "x", "×");
      x.onclick = (ev) => {
        ev.stopPropagation();
        setRef(v.id, r.to, false);
        buildEditor(box, S.byId[v.id]);
        paintRows(); applyFilter();
      };
      chip.appendChild(x);
      b2.appendChild(chip);
    });
    if (seriesOnly > 0) {
      b2.appendChild(el("span", "lg dim", "另有 " + seriesOnly + " 条同系列关系，已由方框归组"));
    }
    r2.appendChild(b2);
    box.appendChild(r2);

    // 添加引用
    const r3 = el("div", "ed-row");
    r3.appendChild(el("div", "ed-label", ""));
    const b3 = el("div", "ed-body");
    const inp = el("input", "refinput");
    inp.placeholder = "输入标题以添加引用…";
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("input", () => showSug(inp, v));
    b3.appendChild(inp);
    r3.appendChild(b3);
    box.appendChild(r3);

    const r4 = el("div", "ed-row");
    r4.appendChild(el("div", "ed-label", ""));
    const b4 = el("div", "ed-body");
    const cbtn = el("button", "ghost sm", "复制该期链接");
    cbtn.onclick = (ev) => {
      ev.stopPropagation();
      navigator.clipboard.writeText("https://www.youtube.com/watch?v=" + v.id);
      toast("已复制链接");
    };
    b4.appendChild(cbtn);
    r4.appendChild(b4);
    box.appendChild(r4);
  }

  let sugBox = null;
  function showSug(inp, v) {
    if (sugBox) sugBox.remove();
    const q = inp.value.trim().toLowerCase();
    if (q.length < 1) return;
    const hits = S.videos
      .filter((x) => x.id !== v.id && !v.refs.some((r) => r.to === x.id))
      .filter((x) => x.title.toLowerCase().indexOf(q) >= 0)
      .slice(0, 40);
    if (!hits.length) return;
    const box = el("div", "sug");
    hits.forEach((x) => {
      const d = el("div");
      d.appendChild(el("span", "sug-d", x.date));
      d.appendChild(document.createTextNode(x.title));
      d.onclick = (ev) => {
        ev.stopPropagation();
        setRef(v.id, x.id, true);
        box.remove(); sugBox = null;
        const ed = S.rows[v.id].querySelector(".editor");
        if (ed) buildEditor(ed, S.byId[v.id]);
        paintRows(); applyFilter();
      };
      box.appendChild(d);
    });
    const r = inp.getBoundingClientRect();
    box.style.position = "absolute";
    box.style.left = window.scrollX + r.left + "px";
    box.style.top = window.scrollY + r.bottom + 4 + "px";
    box.style.position = "fixed";
    box.style.left = r.left + "px";
    box.style.top = r.bottom + 4 + "px";
    document.body.appendChild(box);
    sugBox = box;
  }
  document.addEventListener("click", (e) => {
    if (sugBox && !sugBox.contains(e.target) && !e.target.classList.contains("refinput")) {
      sugBox.remove(); sugBox = null;
    }
  });

  function setTag(vid, tagId, on) {
    const m = S.manual.tags;
    const rule = m[vid] || (m[vid] = { add: [], remove: [] });
    rule.add = rule.add || []; rule.remove = rule.remove || [];
    const isAuto = (S.byId[vid].autoTags || []).indexOf(tagId) >= 0;
    if (on) {
      rule.remove = rule.remove.filter((x) => x !== tagId);
      if (!isAuto && rule.add.indexOf(tagId) < 0) rule.add.push(tagId);
    } else {
      rule.add = rule.add.filter((x) => x !== tagId);
      if (isAuto && rule.remove.indexOf(tagId) < 0) rule.remove.push(tagId);
    }
    commit();
  }

  function setRef(vid, toId, on) {
    const m = S.manual.refs;
    const rule = m[vid] || (m[vid] = { add: [], remove: [] });
    rule.add = rule.add || []; rule.remove = rule.remove || [];
    if (on) {
      rule.remove = rule.remove.filter((x) => x !== toId);
      if (!rule.add.some((r) => r.to === toId)) rule.add.push({ to: toId, type: "mention" });
    } else {
      rule.add = rule.add.filter((r) => r.to !== toId);
      if ((S.byId[vid].autoRefs || []).some((r) => r.to === toId) && rule.remove.indexOf(toId) < 0) {
        rule.remove.push(toId);
      }
    }
    commit();
  }

  function commit() {
    recompute();
    paintRows();
    Array.from(S.active).forEach((id) => { if (!S.byId[id] || !mentionTargets(S.byId[id]).length) S.active.delete(id); });
    try { localStorage.setItem(LSKEY, JSON.stringify(S.manual)); S.dirty = true; } catch (e) {}
    renderTags();
    refreshDirty();
    applyFilter();
  }

  function refreshDirty() {
    const ex = $("#btnExport"), rs = $("#btnReset");
    if (!ex) return;
    const n = Object.keys(S.manual.tags).filter((k) => {
      const r = S.manual.tags[k]; return (r.add || []).length || (r.remove || []).length;
    }).length + Object.keys(S.manual.refs).filter((k) => {
      const r = S.manual.refs[k]; return (r.add || []).length || (r.remove || []).length;
    }).length;
    ex.hidden = !n;
    rs.hidden = !n;
    ex.textContent = "导出修订 (" + n + ")";
  }

  function exportManual() {
    const out = {
      _comment: "人工维护覆盖层。以 YouTube 视频 ID 为索引；构建时与自动数据合并。",
      tags: S.manual.tags, refs: S.manual.refs,
      tagDefs: S.manual.tagDefs || [],
      pendingDismissed: S.manual.pendingDismissed || [],
    };
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "manual.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("已导出 manual.json —— 放入 data/ 后重新构建即可固化");
  }

  /* ---------------- pending drawer ---------------- */
  function pendingIntro() {
    const box = el("div", "pi-intro");
    box.appendChild(el("p", null, "这里列出的不是已知引用，而是需要你判断的「提及」。"));

    const p2 = el("p", null, "");
    p2.appendChild(document.createTextNode("视频简介里偶尔出现"));
    p2.appendChild(el("em", null, "「承接之前的内容」「上一期讲过」"));
    p2.appendChild(document.createTextNode(
      "这类说法——能确定它提到了本频道的某个视频，但从字面无法确定是哪一期。系统不去猜，把它放在这里等你决定。"));
    box.appendChild(p2);

    const ul = el("ul");
    [["有同系列候选时", "在下拉里选一期点「确认」，即建立一条明确引用（蓝色圆点）。"],
     ["想先看看上下文", "点「定位」跳到该视频所在行（若正被筛选隐藏会自动展开）。"],
     ["确定没有对应视频", "点「忽略」，这条不再出现（记在 manual.json 的 pendingDismissed）。"]
    ].forEach(([k, v]) => {
      const li = el("li");
      li.appendChild(el("b", null, k + "："));
      li.appendChild(document.createTextNode(v));
      ul.appendChild(li);
    });
    box.appendChild(ul);

    box.appendChild(el("p", "dim",
      "当前 " + S.videos.length + " 条简介中命中 " + (S.pending.length + (S.manual.pendingDismissed || []).length) +
      " 处。这位作者几乎不在文字里互引，所以队列通常很短——空着是正常的。"));
    return box;
  }

  function renderPending() {
    const btn = $("#btnPending");
    btn.hidden = !S.pending.length;
    btn.innerHTML = "待确认<span class='cnt'>" + S.pending.length + "</span>";
    btn.title = "查看需要人工确认的提及";
    const body = $("#drawerBody");
    body.textContent = "";
    $("#drawerSub").textContent = S.pending.length + " 条";
    body.appendChild(pendingIntro());
    if (!S.pending.length) {
      body.appendChild(el("div", "pi-empty", "当前没有待确认项。"));
      return;
    }
    S.pending.forEach((p) => {
      const v = S.byId[p.videoId];
      if (!v) return;
      const box = el("div", "pi");
      const t = el("div", "pi-t");
      const a = el("a", null, v.title);
      a.href = "https://www.youtube.com/watch?v=" + v.id;
      a.target = "_blank"; a.rel = "noopener";
      t.appendChild(a);
      box.appendChild(t);
      box.appendChild(el("div", "pi-m", v.date + " · 命中「" + p.phrase + "」"));
      box.appendChild(el("div", "pi-e", p.evidence));
      const act = el("div", "pi-a");

      const mates = v.series ? S.videos.filter((x) => x.series === v.series && x.id !== v.id) : [];
      if (mates.length) {
        const sel = el("select");
        sel.appendChild(new Option("关联到同系列的…", ""));
        mates.slice(0, 30).forEach((m) => sel.appendChild(new Option(m.date + " · " + m.title.slice(0, 22), m.id)));
        act.appendChild(sel);
        const ok = el("button", "ghost sm", "确认");
        ok.onclick = () => {
          if (!sel.value) return;
          setRef(v.id, sel.value, true);
          dismissPending(p.videoId);
        };
        act.appendChild(ok);
      } else {
        act.appendChild(el("span", "lg", "没有同系列候选，需在「维护」模式里手动添加引用"));
      }

      const loc = el("button", "ghost sm", "定位");
      loc.onclick = () => {
        $("#drawer").hidden = true;
        const row = S.rows[v.id];
        if (row.classList.contains("hidden")) { S.sel.clear(); S.search = ""; $("#search").value = ""; renderTags(); applyFilter(); }
        row.scrollIntoView({ block: "center", behavior: "smooth" });
        row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
      };
      act.appendChild(loc);

      const ig = el("button", "ghost sm", "忽略");
      ig.onclick = () => dismissPending(p.videoId);
      act.appendChild(ig);
      box.appendChild(act);
      body.appendChild(box);
    });
  }

  function dismissPending(vid) {
    S.manual.pendingDismissed = S.manual.pendingDismissed || [];
    if (S.manual.pendingDismissed.indexOf(vid) < 0) S.manual.pendingDismissed.push(vid);
    S.pending = S.pending.filter((p) => p.videoId !== vid);
    try { localStorage.setItem(LSKEY, JSON.stringify(S.manual)); } catch (e) {}
    renderPending(); refreshDirty();
  }

  /* ---------------- misc ---------------- */
  let toastT = null;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => (t.hidden = true), 2600);
  }

  function init() {
    recompute();
    renderHead();
    renderTags();
    renderList();
    renderPending();
    refreshDirty();
    applyFilter();

    $("#search").addEventListener("input", (e) => {
      S.search = e.target.value.trim().toLowerCase();
      S.active.clear();
      applyFilter();
    });
    $("#btnEdit").onclick = () => {
      S.edit = !S.edit;
      $("#btnEdit").classList.toggle("on", S.edit);
      $("#btnEdit").textContent = S.edit ? "完成" : "维护";
      if (!S.edit && S.openEditor) closeEditor(S.openEditor);
      document.body.classList.toggle("mode-edit", S.edit);
      if (S.edit) toast("点击任意行可编辑标签与引用；改动暂存于本地，导出后写入 manual.json");
    };
    $("#btnExport").onclick = exportManual;
    $("#btnReset").onclick = () => {
      if (!confirm("放弃本地所有人工修订，恢复到文件版本？")) return;
      localStorage.removeItem(LSKEY);
      location.reload();
    };
    $("#btnPending").onclick = () => {
      const d = $("#drawer");
      d.hidden = !d.hidden;
    };
    $("#drawerClose").onclick = () => ($("#drawer").hidden = true);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (sugBox) { sugBox.remove(); sugBox = null; return; }
        if (!$("#drawer").hidden) { $("#drawer").hidden = true; return; }
        if (S.active.size) { S.active.clear(); applyFilter(); }
      }
    });
    let rt;
    window.addEventListener("resize", () => {
      clearTimeout(rt);
      rt = setTimeout(() => { svgResize(); }, 120);
    });
    if (hasLocal()) toast("已载入本地人工修订");
  }

  init();
})();
</script>
</body>
</html>
