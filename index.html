<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerUpGammas · 视频索引</title>
<style>:root{
  --bg:#0a0b0d;
  --bg2:#0e1013;
  --surface:#121417;
  --surface2:#171a1e;
  --line:#22262c;
  --line2:#2c3138;
  --text:#e9e7e3;
  --text2:#a8adb6;
  --muted:#767d88;
  --gold:#c9a227;
  --blue:#5b9cf8;
  --violet:#9b7cf0;
  --amber:#e0a34a;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --gutter:104px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 520px at 12% -8%,rgba(201,162,39,.055),transparent 62%),
             radial-gradient(900px 460px at 92% 0%,rgba(91,156,248,.045),transparent 60%);
}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 32px 80px}

/* ---------- sticky head ---------- */
.stickyhead{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(10,11,13,.97) 0%,rgba(10,11,13,.93) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  margin:0 -32px;padding:0 32px;
}
.head{display:flex;align-items:center;gap:16px;height:54px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.ch{
  color:var(--text);text-decoration:none;font-size:16.5px;font-weight:650;
  letter-spacing:.2px;
}
.ch:hover{color:var(--gold)}
.sub{font-size:12px;color:var(--muted);letter-spacing:.14em}
.headmeta{
  margin-left:auto;display:flex;gap:0;align-items:center;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;
}
.headmeta b{color:var(--text2);font-weight:500}
.headmeta i{font-style:normal;opacity:.45;margin:0 9px}
.tools{display:flex;align-items:center;gap:8px;margin-left:16px}
.search{
  display:flex;align-items:center;gap:7px;padding:0 9px;height:27px;
  border:1px solid var(--line);border-radius:7px;background:var(--bg2);color:var(--muted);
  transition:border-color .16s,color .16s;
}
.search:focus-within{border-color:var(--line2);color:var(--text2)}
.search input{
  width:132px;background:none;border:0;outline:0;color:var(--text);
  font-family:var(--sans);font-size:12.5px;
}
.search input::placeholder{color:#5d646e}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}

button.ghost{
  height:27px;padding:0 10px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg2);color:var(--text2);
  font-family:var(--sans);font-size:12px;transition:.16s;
}
button.ghost:hover{border-color:var(--line2);color:var(--text)}
button.ghost.on{background:rgba(201,162,39,.13);border-color:rgba(201,162,39,.5);color:#e6c65c}
button.ghost.sm{height:24px;padding:0 9px;font-size:11.5px}
button.ghost .cnt{
  display:inline-block;margin-left:5px;font-family:var(--mono);font-size:10.5px;
  color:#e6c65c;opacity:.9;
}

/* ---------- tag bar ---------- */
.tagbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:5px;
  padding:0 0 10px;
}
.tag{
  --tc:#8b95a3;
  display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 8px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg2);
  color:var(--text2);font-size:11.5px;cursor:pointer;transition:.14s;white-space:nowrap;
}
.tag:hover{border-color:var(--line2);color:var(--text)}
.tag .n{font-family:var(--mono);font-size:10px;color:#6b727d}
.tag .sw{width:6px;height:6px;border-radius:50%;background:var(--tc);opacity:.85}
.tag.all{font-weight:550}
.tag.on{
  background:color-mix(in srgb,var(--tc) 17%,transparent);
  border-color:color-mix(in srgb,var(--tc) 62%,transparent);
  color:color-mix(in srgb,var(--tc) 46%,#fff);
}
.tag.on .n{color:inherit;opacity:.6}
.tag.all.on{--tc:var(--gold)}
.tagbar .dvd{width:1px;height:16px;background:var(--line);margin:0 5px}

/* ---------- legend ---------- */
.legend{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:11px 0 5px;font-size:11px;color:var(--muted);
}
.lg{display:inline-flex;align-items:center;gap:7px}
.lg em{font-style:normal;color:#5f6670}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.mention{background:transparent;border:1.5px solid var(--blue)}
.fbox{
  width:15px;height:10px;border-radius:3px;display:inline-block;
  border:1px solid rgba(155,124,240,.62);background:rgba(155,124,240,.1);
}
.hint{margin-left:auto;color:#6b7280}
.lg.dim{color:#6b7280;font-size:11px}

/* ---------- board ---------- */
.board{position:relative;border-top:1px solid var(--line)}
.cols{
  display:grid;grid-template-columns:86px minmax(0,1fr) 96px;
  padding:6px 0 6px 12px;margin-right:var(--gutter);
  font-size:9.5px;letter-spacing:.14em;color:#5c636d;text-transform:uppercase;
  border-bottom:1px solid var(--line);
}
.cols .c-refs{text-align:right;padding-right:2px}
.list{position:relative;padding-right:var(--gutter)}

.row{
  scroll-margin-top:132px;
  display:grid;grid-template-columns:86px minmax(0,1fr) 96px;
  align-items:center;min-height:33px;padding:0 0 0 12px;
  border-bottom:1px solid #171a1e;position:relative;
  transition:background .14s;
}
.row:not(.hidden):hover{background:#111418}
.row.has-note{align-items:start;padding-top:10px;padding-bottom:10px}
.row.has-note .c-date,.row.has-note .c-refs{padding-top:2px}
.row.hidden{display:none}
.row .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.5}
.row:hover .stripe{opacity:.85}
.c-title{min-width:0;padding-right:12px}
.c-title a{
  color:#dcd9d4;text-decoration:none;font-size:13px;line-height:1.32;
  /* 按文字宽度收缩：标题右侧的空白留给「点空白开笔记」，而不是被链接吃掉 */
  display:inline-block;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top;
  transition:color .14s;
}
.row:hover .c-title a{color:#fff}
.c-title a:hover{color:var(--gold)}
.c-date{
  font-family:var(--mono);font-size:10.5px;color:#6f7680;
  font-variant-numeric:tabular-nums;
}
.c-refs{display:flex;gap:7px;justify-content:flex-end;align-items:center;padding-right:0;flex-wrap:wrap}

.badge{
  width:10px;height:10px;min-width:10px;border-radius:50%;cursor:pointer;
  padding:0;background:transparent;position:relative;transition:.14s;
}
.badge::after{content:"";position:absolute;inset:-7px;border-radius:50%}
.badge.mention{border:1px solid rgba(91,156,248,.62)}
.badge.series{border:1px solid rgba(155,124,240,.7);position:relative}
.badge.series::before{
  content:"";position:absolute;inset:2px;border-radius:50%;
  border:1px solid rgba(155,124,240,.5);
}
.badge:hover{border-color:var(--blue);background:rgba(91,156,248,.3);transform:scale(1.28)}
.badge.series:hover{border-color:var(--violet);background:rgba(155,124,240,.3)}
.badge.sel{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,156,248,.14)}
.badge.series.sel{background:var(--violet);border-color:var(--violet);box-shadow:0 0 0 3px rgba(155,124,240,.16)}

.penbtn{
  display:none;height:18px;padding:0 6px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(201,162,39,.45);background:rgba(201,162,39,.1);
  color:#dcc06a;font-size:10px;font-family:var(--sans);
}
.dev .penbtn{display:inline-flex;align-items:center}
.dev .row:not(.hidden){cursor:pointer}
.dev .row .c-title a{cursor:pointer}
.dev .c-refs{flex-wrap:nowrap;gap:6px}

/* row states */
.row.is-source{background:rgba(201,162,39,.07)}
.row.is-source .stripe{opacity:1;background:var(--gold)!important}
.row.is-target{background:rgba(91,156,248,.1)}
.row.is-target .c-title a{color:#fff}
.row.is-temp .c-date::after{
  content:"临时";margin-left:7px;font-size:9.5px;color:var(--amber);
  border:1px solid rgba(224,163,74,.4);border-radius:3px;padding:0 3px;
  font-family:var(--sans);letter-spacing:.04em;
}
.row.is-target::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--blue);
}
.row.flash{animation:flash .9s ease-out}
@keyframes flash{0%{background:rgba(91,156,248,.28)}100%{background:rgba(91,156,248,.1)}}

/* year divider */
.yr{
  display:flex;align-items:center;gap:10px;
  padding:15px 0 5px 12px;margin-right:var(--gutter);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:#5b636d;
}
.yr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#1d2126,transparent)}
.yr.hidden{display:none}

/* links svg */
.links{
  position:absolute;top:0;right:0;width:var(--gutter);height:100%;
  pointer-events:none;overflow:visible;z-index:2;
}
.frames{
  position:absolute;top:0;left:0;width:calc(100% - var(--gutter));height:100%;
  pointer-events:none;overflow:visible;z-index:2;
}
.links path{fill:none;stroke-width:1.1}

/* ---------- editor ---------- */
.row.editing{background:#101317}
.editor{
  grid-column:1/-1;padding:2px 0 16px 40px;display:flex;flex-direction:column;gap:12px;
  animation:fade .18s ease-out;
}
/* 只做位移，不用 opacity：动画被暂停或系统减少动效时内容也不会消失 */
@keyframes fade{from{transform:translateY(-3px)}to{transform:none}}
.ed-row{display:flex;align-items:flex-start;gap:10px}
.ed-label{
  width:52px;flex:none;font-size:10.5px;letter-spacing:.1em;color:#5f6670;
  padding-top:5px;text-transform:uppercase;
}
.ed-body{display:flex;flex-wrap:wrap;gap:5px;align-items:center;flex:1}
.tag.mini{height:22px;font-size:11px;padding:0 8px}
.tag.mini.on{font-weight:500}
.refitem .rdot{
  width:8px;height:8px;border-radius:50%;flex:none;
  border:1px solid rgba(91,156,248,.65);
}
.refitem.series .rdot{border-color:rgba(155,124,240,.75);box-shadow:inset 0 0 0 1px rgba(155,124,240,.45)}
.editor button.ghost{border-color:#2c3138;background:#15181c}
.refitem{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 4px 0 7px;
  border-radius:12px;border:1px solid var(--line2);background:#15181c;
  font-size:11px;color:var(--text2);cursor:pointer;max-width:100%;
}
.refitem:hover{border-color:#3d444d}
.refitem .rd{font-family:var(--mono);font-size:9.5px;color:#6f7680;flex:none}
.refitem .rt{color:#d6d3ce;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refitem .mk{
  flex:none;font-size:9px;line-height:12px;color:#caa227;padding:0 2px;
  border:1px solid rgba(201,162,39,.35);border-radius:3px;
}
.refitem .x{
  cursor:pointer;color:#6b7280;font-size:13px;line-height:1;padding:0 3px;flex:none;
}
.refitem .x:hover{color:#e07070}
.refitem.series{border-style:dashed}
.refinput{
  height:26px;min-width:190px;padding:0 9px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg2);color:var(--text);
  font-family:var(--sans);font-size:12px;outline:0;
}
.refinput:focus{border-color:var(--line2)}

/* ---------- 选目标 ---------- */
.picking .row:not(.hidden){cursor:crosshair}
.picking .row.pick-src{cursor:default;background:#101317}
.picking .row.pick-used{opacity:.42;cursor:not-allowed}
.picking .row:not(.pick-src):not(.pick-used):hover{background:rgba(91,156,248,.09);box-shadow:inset 0 0 0 1px rgba(91,156,248,.38)}
.picking .row:not(.pick-src):not(.pick-used):hover .c-title a{color:#fff}
.picking .row:not(.pick-src):not(.pick-used):hover .c-refs::before{
  content:"＋ 引用";font-size:9.5px;color:#85b7eb;margin-right:2px;white-space:nowrap;
}
.picking .row.pick-used .c-refs::before{
  content:"已引用";font-size:9.5px;color:#6f7680;margin-right:2px;white-space:nowrap;
}
.ed-pick{
  margin:2px 0 0 62px;padding:8px;display:flex;flex-direction:column;gap:7px;
  border:1px solid var(--line2);border-radius:10px;background:#121519;
}
.pk-head{display:flex;align-items:center;gap:8px;font-size:11px;color:#8a9099}
.pk-k{
  flex:none;font-size:10px;color:#85b7eb;padding:0 5px;border-radius:4px;
  border:1px solid rgba(91,156,248,.4);background:rgba(91,156,248,.1);
}
.pk-sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-input{width:100%;min-width:0}
.pk-list{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.pk-group{font-size:10px;letter-spacing:.08em;color:#6f7680;padding:7px 8px 3px}
.pk-item{
  display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;
  cursor:pointer;font-size:12px;
}
.pk-item:hover,.pk-item.cur{background:#1d2228}
.pk-item.used{opacity:.45;cursor:default}
.pk-item.used:hover{background:none}
.pk-d{font-family:var(--mono);font-size:10px;color:#6f7680;flex:none}
.pk-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d6d3ce}
.pk-item.used .pk-t{color:#8a9099}
.pk-t mark{background:rgba(201,162,39,.22);color:#f0d98a;border-radius:2px;padding:0 1px}
.pk-m{
  flex:none;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10px;color:#7d848e;
}
.pk-st{flex:none;font-size:10px;padding:1px 4px;border-radius:3px;border:1px solid transparent}
.pk-st.on{color:#7d848e;border-color:var(--line2)}
.pk-st.rev{color:#e0a34a;border-color:rgba(224,163,74,.4);background:rgba(224,163,74,.08)}
.pk-st.ser{color:#b9a4f5;border-color:rgba(155,124,240,.4);background:rgba(155,124,240,.08)}
.pk-empty{padding:10px 8px;font-size:11.5px;color:#7f858e}

/* ---------- drawer ---------- */
.drawer{
  position:fixed;right:24px;bottom:24px;width:452px;max-width:calc(100vw - 48px);
  max-height:min(64vh,560px);z-index:60;display:flex;flex-direction:column;
  background:#0f1215;border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.drawer-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--line);font-size:12.5px;
}
.drawer-sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.drawer-head button{margin-left:auto}
.drawer-body{overflow:auto;padding:8px 14px 14px}
.pi-intro{
  margin:8px 0 4px;padding:11px 13px;border-radius:8px;
  background:#0d1013;border:1px solid #1c2026;
  font-size:11.5px;line-height:1.68;color:#98a0aa;
}
.pi-intro p{margin:0 0 7px}
.pi-intro p:last-child{margin:0}
.pi-intro em{font-style:normal;color:#c6c2ba}
.pi-intro b{color:#d8d4cc;font-weight:600}
.pi-intro ul{margin:7px 0 8px;padding-left:0;list-style:none}
.pi-intro li{position:relative;padding-left:12px;margin-bottom:4px}
.pi-intro li::before{
  content:"";position:absolute;left:2px;top:.72em;width:3px;height:3px;
  border-radius:50%;background:#4a515b;
}
.pi-intro .dim{color:#6b7280;font-size:11px;margin-top:8px}
.pi-empty{
  padding:18px 0 22px;text-align:center;color:#5f6670;font-size:12px;
}
.pi{padding:11px 0;border-bottom:1px solid #191c21}
.pi:last-child{border-bottom:0}
.pi-t{font-size:12.5px;color:#d5d2cd;margin-bottom:3px}
.pi-t a{color:inherit;text-decoration:none}
.pi-t a:hover{color:var(--gold)}
.pi-m{font-family:var(--mono);font-size:10.5px;color:#5f6670;margin-bottom:5px}
.pi-e{
  font-size:11.5px;color:#9aa1ab;line-height:1.55;background:#12151a;
  border-left:2px solid #2a2f36;padding:6px 9px;border-radius:0 4px 4px 0;margin-bottom:7px;
}
.pi-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pi-a select{
  height:24px;background:var(--bg2);color:var(--text2);border:1px solid var(--line);
  border-radius:5px;font-size:11.5px;max-width:230px;font-family:var(--sans);
}

/* ---------- footer / toast ---------- */
.foot{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:22px 0 0;font-size:11.5px;color:#5f6670;
}
.foot .sep{opacity:.5}
.foot code{font-family:var(--mono);font-size:11px;color:#7d848e}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;max-width:calc(100vw - 40px);
  background:#1a1e23;border:1px solid var(--line2);color:var(--text);
  padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:80;
  box-shadow:0 14px 40px rgba(0,0,0,.55);
  animation:fade .2s ease-out;
}
.toast-act{
  flex:none;border:0;background:none;padding:0;cursor:pointer;
  color:#85b7eb;font-family:var(--sans);font-size:12.5px;
  text-decoration:underline;text-underline-offset:2px;
}
.toast-act:hover{color:#b5d4f4}

/* ---------- 模式标识 ---------- */
.modechip{
  font-size:10px;letter-spacing:.08em;color:#e6c65c;
  border:1px solid rgba(201,162,39,.45);background:rgba(201,162,39,.12);
  border-radius:4px;padding:1px 6px;
}
.devtools{display:inline-flex;gap:6px;align-items:center}

/* ---------- 行内笔记（只读展示） ---------- */
.c-note{display:none}
.c-note.has{
  display:block;overflow:hidden;position:relative;
  max-height:calc(1.62em * 3);margin-top:4px;font-size:12px;line-height:1.62;
  color:#98a1ac;cursor:pointer;
}
.c-note.has::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:1.5em;
  background:linear-gradient(180deg,rgba(10,11,13,0),rgba(10,11,13,.92));
  pointer-events:none;
}
.c-note.has.open{max-height:none}
.c-note.has.open::after{display:none}
.c-note.has:hover{color:#b6bec8}
.c-note p{margin:0 0 2px}
.c-note p:last-child{margin:0}
.c-note h1,.c-note h2,.c-note h3{font-size:12.5px;font-weight:600;color:#c3cad3;margin:4px 0 2px}
.c-note li{margin-left:14px;list-style:disc}
.c-note blockquote{
  border-left:2px solid #2b3138;padding-left:8px;color:#8b939d;margin:2px 0;
}
.c-note code{
  font-family:var(--mono);font-size:11px;background:#171b20;border-radius:3px;padding:0 3px;
}
.c-note pre{
  font-family:var(--mono);font-size:11px;background:#12151a;border:1px solid #1d2127;
  border-radius:5px;padding:6px 8px;margin:3px 0;white-space:pre-wrap;
}
.c-note a{color:#78aef8}
.c-note hr{border:0;border-top:1px solid #232830;margin:5px 0}

/* ---------- 笔记编辑面板 ---------- */
.np{
  grid-column:1/-1;padding:4px 0 16px 12px;
  animation:fade .18s ease-out;
}
.np-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.np-label{font-size:10.5px;letter-spacing:.12em;color:#5f6670;text-transform:uppercase}
.np-tip{font-size:11px;color:#4f565f}
.np-done{margin-left:auto}
.np-body{
  border:1px solid #232830;border-radius:8px;background:#0d1013;
  padding:10px 13px;min-height:44px;
}
.ne{font-size:13px;line-height:1.7;color:#d6d3ce}
.ne-block{outline:0;padding:1px 0;min-height:1.7em;white-space:pre-wrap;word-break:break-word}
.ne-block:empty:focus::before{content:"输入文字，# 标题、- 列表、> 引用";color:#4a5158}
.ne-block[data-type=h1]{font-size:18px;font-weight:650;color:#f0ede8;margin:4px 0 3px}
.ne-block[data-type=h2]{font-size:15.5px;font-weight:640;color:#ece9e4;margin:3px 0 3px}
.ne-block[data-type=h3]{font-size:13.5px;font-weight:620;color:#e4e0da;margin:3px 0 2px}
.ne-block[data-type=ul],
.ne-block[data-type=ol]{padding-left:20px;position:relative}
.ne-block[data-type=ul]::before{
  content:"•";position:absolute;left:7px;color:#6b737d;
}
.ne-block[data-type=ol]::before{
  content:attr(data-idx) ".";position:absolute;left:4px;color:#6b737d;
  font-family:var(--mono);font-size:11px;top:3px;
}
.ne-block[data-type=quote]{
  border-left:2px solid #2f353d;padding-left:10px;color:#a9b1bb;
}
.ne-block[data-type=code]{
  font-family:var(--mono);font-size:12px;background:#12151a;border:1px solid #1d2127;
  border-radius:6px;padding:7px 9px;margin:4px 0;white-space:pre-wrap;
}
.ne-block[data-type=hr]{
  border-top:1px solid #2a3038;margin:8px 0;min-height:0;padding:0;height:1px;
}
.ne-block a{color:#78aef8;text-decoration:underline}
.ne-block code{
  font-family:var(--mono);font-size:11.5px;background:#1a1e24;border-radius:3px;padding:0 3px;
}
.ne-block strong{color:#f2efe9;font-weight:650}


/* ================= 响应式 ================= */

/* 小笔记本 / 平板横屏：略收列宽 */
@media (max-width:1080px){
  :root{--gutter:88px}
  .cols,.row{grid-template-columns:82px minmax(0,1fr) 84px}
}

/* 平板竖屏：继续收紧，仍保留连线 */
@media (max-width:820px){
  :root{--gutter:70px}
  .wrap{padding:0 18px 56px}
  .stickyhead{margin:0 -18px;padding:0 18px}
  .cols,.row{grid-template-columns:76px minmax(0,1fr) 62px}
  .c-date{font-size:10px}
  .c-title a{font-size:13px}
  .np{padding-left:8px}
}

/* 手机竖屏（iPhone 17 ≈ 393pt） */
@media (max-width:560px){
  :root{--gutter:0px}
  .wrap{padding:0 12px 44px}
  .wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .stickyhead{margin:0 -12px;padding:0 12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}

  /* 顶部：两行 —— 标题+按钮 / 搜索；再下面是横向滚动的标签 */
  .head{height:auto;padding:9px 0 7px;gap:8px;flex-wrap:wrap}
  .brand{gap:7px;min-width:0}
  .ch{font-size:15px}
  .brand .sub{font-size:10.5px;letter-spacing:.08em}
  .headmeta{display:none}
  .tools{margin-left:auto;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .search{height:30px;padding:0 8px}
  .search input{width:104px;font-size:16px}  /* 16px：避免 iOS 聚焦时自动放大 */
  button.ghost{height:30px;padding:0 9px;font-size:11.5px}
  .modechip{font-size:9px;padding:1px 4px}

  .tagbar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:6px;padding:0 0 9px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
    mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
  .tagbar::-webkit-scrollbar{display:none}
  .tag{flex:0 0 auto;height:26px;padding:0 9px;font-size:11.5px}

  .legend{gap:14px;padding:9px 0 3px;font-size:10px}
  .legend em{display:none}
  .hint{margin-left:0}

  /* 三列：日期 / 标题 / 引用 */
  .cols{margin-right:0;padding:6px 0 6px 10px;grid-template-columns:76px minmax(0,1fr) 34px}
  .cols .c-refs{text-align:right}
  .list{padding-right:0}
  .row{grid-template-columns:76px minmax(0,1fr) 34px;padding:8px 0 8px 10px;min-height:44px}
  .links{display:none}
  .frames{width:100%}
  .c-date{font-size:10px}
  .c-title{padding-right:8px}
  /* 窄屏标题允许两行，避免只剩几个字 */
  .c-title a{
    font-size:12.5px;line-height:1.38;white-space:normal;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;text-overflow:clip;
    width:fit-content;max-width:100%;   /* 短标题不占满整格，右侧留白可点开笔记 */
  }
  .c-note.has{font-size:11.5px;max-height:calc(1.6em*3)}
  .yr{padding:13px 0 4px 10px;margin-right:0;font-size:9px}

  /* 开发版：给「编辑」按钮留位置 */
  .dev .cols,.dev .row{grid-template-columns:76px minmax(0,1fr) 62px}
  .c-refs{padding-right:2px}

  .drawer{left:12px;right:12px;bottom:12px;width:auto;max-height:72vh}
  .foot{padding-bottom:env(safe-area-inset-bottom)}
  .np{padding:4px 0 14px 0}
  .np-tip{display:none}
  .np-body{padding:9px 11px}
  .ne{font-size:14px;line-height:1.72}
  .ne-block[data-type=h1]{font-size:17px}
  .refinput{font-size:16px;height:32px}
  .ed-pick{margin-left:0}
  .pk-sub{display:none}
  .pk-list{max-height:46vh}
  .pk-item{padding:7px 6px}
  .pk-m{display:none}
  .picking .row:not(.pick-src):not(.pick-used):hover .c-refs::before,
  .picking .row.pick-used .c-refs::before{display:none}
}

/* 触屏：放大可点区域 */
@media (pointer:coarse){
  .badge{width:12px;height:12px;min-width:12px}
  .badge::after{inset:-11px}
  .row{min-height:48px}
  .penbtn{height:26px;padding:0 8px;font-size:11px}
  .tag{min-height:26px}
  a,button{-webkit-tap-highlight-color:transparent}
}

/* 尊重系统「减少动态效果」 */
@media (prefers-reduced-motion:reduce){
  .np,.editor,.toast,.row.flash{animation:none}
  *{scroll-behavior:auto}
}

/* ---------- 保存状态 ---------- */
.savestate{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;
  color:#6b7280;white-space:nowrap;
}
.savestate.ok{color:#7fbf7f}
.savestate.err{color:#e08a8a}
.np-status{
  font-family:var(--mono);font-size:10.5px;color:#6b7280;
  margin-left:auto;white-space:nowrap;
}
.np-status:empty{display:none}
.np-done{margin-left:10px}
.storagewarn{
  position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:90;
  max-width:min(560px,calc(100vw - 32px));
  background:#241717;border:1px solid #5b2b2b;border-radius:9px;
  padding:11px 15px;font-size:12px;line-height:1.6;color:#e6c9c9;
  box-shadow:0 16px 40px rgba(0,0,0,.6);
}
.storagewarn b{color:#f0a8a8;margin-right:4px}

.modal{
  position:fixed;inset:0;z-index:120;background:rgba(4,5,7,.68);
  display:flex;align-items:center;justify-content:center;padding:18px;
  backdrop-filter:blur(3px);
}
.modal-box{
  width:min(468px,100%);background:#111418;border:1px solid #2c3138;

.modal-box h3{margin:0 0 6px;font-size:15px;font-weight:620}

<script>/*
 * 笔记模块：Markdown 子集 + Notion 风格的块编辑器
 *
 * 支持：
 *   # / ## / ###  标题      - 或 *  无序列表     1.  有序列表
 *   >  引用         ```  代码块        ---  分隔线
 *   **粗体**  *斜体*  `行内代码`  [文字](链接)
 *
 * 用法：
 *   NoteEditor.render(md)              -> HTML 字符串（只读展示）
 *   new NoteEditor(host, {value, onInput, placeholder})
 *   .getValue() / .focus() / .destroy()
 */
(function (global) {
  "use strict";

  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------------- 行内 markdown <-> html ---------------- */

  function inlineToHtml(text) {
    let s = escapeHtml(text);
    s = s.replace(/`([^`]+)`/g, (m, a) => "<code>" + a + "</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, (m, a) => "<strong>" + a + "</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, (m, p1, a) => p1 + "<em>" + a + "</em>");
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
      (m, t, u) => '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>");
    return s;
  }

  function inlineToMd(node) {
    let out = "";
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) { out += n.nodeValue; return; }
      if (n.nodeType !== 1) return;
      const tag = n.nodeName.toLowerCase();
      if (tag === "strong" || tag === "b") out += "**" + inlineToMd(n) + "**";
      else if (tag === "em" || tag === "i") out += "*" + inlineToMd(n) + "*";
      else if (tag === "code") out += "`" + n.textContent + "`";
      else if (tag === "a") out += "[" + n.textContent + "](" + (n.getAttribute("href") || "") + ")";
      else if (tag === "br") out += "\n";
      else out += inlineToMd(n);
    });
    return out;
  }

  /* ---------------- 块级 markdown ---------------- */

  const HR = /^\s*([-*_])\1{2,}\s*$/;

  function parseMd(md) {
    const lines = String(md || "").replace(/\r/g, "").split("\n");
    const blocks = [];
    let inCode = false, buf = [];
    for (const line of lines) {
      if (/^\s*```/.test(line)) {
        if (inCode) { blocks.push({ t: "code", text: buf.join("\n") }); buf = []; inCode = false; }
        else inCode = true;
        continue;
      }
      if (inCode) { buf.push(line); continue; }
      if (!line.trim()) continue;
      let m;
      if ((m = line.match(/^(#{1,3})\s+(.*)$/))) blocks.push({ t: "h" + m[1].length, text: m[2] });
      else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) blocks.push({ t: "ul", text: m[1] });
      else if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) blocks.push({ t: "ol", text: m[1] });
      else if ((m = line.match(/^>\s?(.*)$/))) blocks.push({ t: "quote", text: m[1] });
      else if (HR.test(line)) blocks.push({ t: "hr", text: "" });
      else blocks.push({ t: "p", text: line });
    }
    if (inCode && buf.length) blocks.push({ t: "code", text: buf.join("\n") });
    if (!blocks.length) blocks.push({ t: "p", text: "" });
    return blocks;
  }

  function blocksToMd(blocks) {
    return blocks.map((b) => {
      switch (b.t) {
        case "h1": return "# " + b.text;
        case "h2": return "## " + b.text;
        case "h3": return "### " + b.text;
        case "ul": return "- " + b.text;
        case "ol": return "1. " + b.text;
        case "quote": return "> " + b.text;
        case "hr": return "---";
        case "code": return "```\n" + b.text + "\n```";
        default: return b.text;
      }
    }).join("\n");
  }

  function render(md) {
    const blocks = parseMd(md);
    return blocks.map((b) => {
      if (b.t === "hr") return '<hr class="ne-hr">';
      if (b.t === "code") return '<pre class="ne-pre"><code>' + escapeHtml(b.text) + "</code></pre>";
      const inner = inlineToHtml(b.text);
      if (b.t === "p") return "<p>" + inner + "</p>";
      if (b.t === "ul") return "<li>" + inner + "</li>";
      if (b.t === "ol") return "<li>" + inner + "</li>";
      if (b.t === "quote") return "<blockquote>" + inner + "</blockquote>";
      const lv = b.t.slice(1);
      return "<h" + lv + ">" + inner + "</h" + lv + ">";
    }).join("");
  }

  /* ---------------- 编辑器 ---------------- */

  // 行首标记 -> 块类型；允许标记后直接跟着内容（粘贴、连续输入也能识别）
  const SHORTCUT = [
    [/^(#{1,3})\s+([\s\S]*)$/, (m) => ({ t: "h" + m[1].length, rest: m[2] })],
    [/^[-*]\s+([\s\S]*)$/, (m) => ({ t: "ul", rest: m[1] })],
    [/^(\d+)\.\s+([\s\S]*)$/, (m) => ({ t: "ol", rest: m[2] })],
    [/^>\s+([\s\S]*)$/, (m) => ({ t: "quote", rest: m[1] })],
  ];

  function caretAtStart(el) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return false;
    const r = sel.getRangeAt(0).cloneRange();
    r.selectNodeContents(el);
    r.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
    return r.toString().length === 0;
  }

  function caretAtEnd(el) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return false;
    const r = sel.getRangeAt(0);
    if (!el.contains(r.startContainer)) return false;
    const after = document.createRange();
    after.selectNodeContents(el);
    after.setStart(r.endContainer, r.endOffset);
    return after.toString().length === 0;
  }

  function focusEnd(el) {
    el.focus();
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  class Editor {
    constructor(host, opts) {
      this.host = host;
      this.opts = opts || {};
      this.onInput = this.opts.onInput || function () {};
      host.classList.add("ne");
      host.textContent = "";
      const blocks = parseMd(this.opts.value || "");
      blocks.forEach((b) => host.appendChild(this.makeBlock(b.t, b.text)));
      host.addEventListener("keydown", (e) => this.onKeyDown(e));
      host.addEventListener("input", (e) => this.onInputEvent(e));
      host.addEventListener("paste", (e) => this.onPaste(e));
      host.addEventListener("blur", () => this.fire(), true);
      this.renumber();
    }

    makeBlock(type, text) {
      const d = document.createElement("div");
      d.className = "ne-block";
      d.dataset.type = type;
      d.setAttribute("contenteditable", "true");
      if (type === "hr") { d.setAttribute("contenteditable", "false"); d.textContent = ""; }
      else d.innerHTML = inlineToHtml(text || "");
      return d;
    }

    renumber() {
      let n = 0;
      this.blocks().forEach((b) => {
        if (b.dataset.type === "ol") { n += 1; b.dataset.idx = n; }
        else n = 0;
      });
    }

    blocks() {
      return Array.from(this.host.querySelectorAll(".ne-block"));
    }

    blockOf(node) {
      const el = node && node.nodeType === 1 ? node : node && node.parentElement;
      return el ? el.closest(".ne-block") : null;
    }

    getValue() {
      const bs = this.blocks().map((el) => ({
        t: el.dataset.type,
        text: el.dataset.type === "code" ? el.textContent : inlineToMd(el),
      }));
      return blocksToMd(bs.filter((b) => b.t === "hr" || b.t === "code" || b.text.trim() !== ""));
    }

    focus() {
      const first = this.blocks()[0];
      if (first) focusEnd(first);
    }

    destroy() { this.host.textContent = ""; }

    fire() { this.onInput(this.getValue()); }

    onInputEvent(e) {
      const el = this.blockOf(e.target);
      if (!el) return;

      // Markdown 快捷输入：`# ` → 标题，`- ` → 列表，`> ` → 引用，`1. ` → 有序
      if (el.dataset.type === "p" && caretAtEnd(el)) {
        const txt = el.textContent;
        for (const [re, fn] of SHORTCUT) {
          const m = re.exec(txt);
          if (m) {
            const r = fn(m);
            el.dataset.type = r.t;
            el.textContent = r.rest;
            focusEnd(el);
            break;
          }
        }
      }

      // 行内格式：在光标位于行尾时把 **粗体** 之类转成真实标签
      if (el.dataset.type !== "code" && el.dataset.type !== "hr" && caretAtEnd(el)) {
        const raw = inlineToMd(el);
        const html = inlineToHtml(raw);
        if (html !== el.innerHTML && /\*\*|`|\[[^\]]*\]\(/.test(raw)) {
          el.innerHTML = html;
          focusEnd(el);
        }
      }
      this.renumber();
      this.fire();
    }

    onKeyDown(e) {
      const el = this.blockOf(e.target);
      if (!el) return;

      if (e.key === "Enter" && !e.shiftKey) {
        if (el.dataset.type === "code" || el.dataset.type === "hr") return;
        e.preventDefault();
        const isList = el.dataset.type === "ul" || el.dataset.type === "ol" || el.dataset.type === "quote";
        const nextType = isList ? el.dataset.type : "p";
        // 空列表项回车 -> 退出列表
        if (isList && el.textContent.trim() === "") {
          el.dataset.type = "p";
          return;
        }
        const nb = this.makeBlock(nextType, "");
        el.after(nb);
        focusEnd(nb);
        this.renumber();
        this.fire();
        return;
      }

      if (e.key === "`" && el.dataset.type === "p" && el.textContent === "``") {
        e.preventDefault();
        el.dataset.type = "code";
        el.textContent = "";
        this.fire();
        return;
      }

      if (e.key === "Backspace") {
        const prev = el.previousElementSibling;
        const empty = el.textContent.trim() === "";
        if (el.dataset.type !== "p" && empty && caretAtStart(el)) {
          e.preventDefault();
          el.dataset.type = "p";
          this.renumber();
          this.fire();
          return;
        }
        if (!caretAtStart(el)) { this.fire(); return; }
        if (!prev) return;
        e.preventDefault();
        if (empty) {
          el.remove();
          focusEnd(prev);
        } else {
          const frag = document.createDocumentFragment();
          while (el.firstChild) frag.appendChild(el.firstChild);
          prev.appendChild(frag);
          el.remove();
          focusEnd(prev);
        }
        this.fire();
      }
    }

    onPaste(e) {
      const el = this.blockOf(e.target);
      if (!el) return;
      const text = (e.clipboardData || window.clipboardData).getData("text/plain");
      if (!text) return;
      e.preventDefault();

      const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.trim());
      if (lines.length <= 1) {
        document.execCommand("insertText", false, text);
        return;
      }
      const frag = document.createDocumentFragment();
      lines.forEach((ln) => frag.appendChild(this.makeBlock("p", ln)));
      el.after(frag);
      this.fire();
    }
  }

    render, parseMd, blocksToMd, inlineToHtml, Editor,
    create(host, opts) { return new Editor(host, opts); },
    isEmpty(md) { return !String(md || "").trim(); },

    active: new Set(),    // 已展开引用的行（视频 id）
    openEditor: null,     // 展开「标签/引用」面板的行
    openNote: null,       // 展开笔记编辑器的行

    pickItems: [],        // 当前候选（供键盘上下移动）
    undo: null,           // 最近一次引用改动的快照
    manual: loadManual(),
    rows: {},
    years: [],
    dirty: false,          // 尚未来得及落盘
    pendingSync: false,    // 有改动还没推到远端
    remoteDiffers: false,   // 本地改动与线上版本不一致
    dirtyKeys: new Set(),   // 自上次同步以来改动的字段，形如 "notes:<id>"

  DATA.videos.forEach((v) => (S.byId[v.id] = v));
  function rebuildTagIndex() {
    const map = new Map();
    DATA.tags.forEach((t) => map.set(t.id, Object.assign({}, t)));

        if (d.color) cur.color = d.color;
      } else {

  /* ---------------- manual overlay ---------------- */
  function emptyManual() {
    return { tags: {}, refs: {}, notes: {}, tagDefs: [], pendingDismissed: [] };
  }
  // 公开版只认构建时写进文件的版本；开发版只在「有未同步改动」时才用浏览器暂存
  function loadManual() {
    if (IS_DEV) {
      try {
        const raw = localStorage.getItem(LSKEY);
        if (raw) {
          const o = JSON.parse(raw);
          // 已经同步过的暂存不再覆盖页面内嵌的版本，避免拿旧数据编辑
          if (o && o._pending) return Object.assign(emptyManual(), o);
        }
      } catch (e) {}

    return window.__MANUAL__ ? Object.assign(emptyManual(), JSON.parse(JSON.stringify(window.__MANUAL__))) : emptyManual();
  }
  // 「有本地修订」= 存在未同步的改动；仅仅是存过一份不算
  const hasLocal = () => {

      if (!raw) return false;
      const o = JSON.parse(raw);
      return !!o._pending;
    } catch (e) { return false; }
  };

  function mergeTags(v) {
    const rule = S.manual.tags[v.id] || {};
    const rm = rule.remove || [], ad = rule.add || [];
    let out = (v.autoTags || []).filter((t) => rm.indexOf(t) < 0);
    ad.forEach((t) => {
      if (S.tagById[t] && out.indexOf(t) < 0) out.push(t);
    });
    const hasPlaylist = out.some((t) => S.tagById[t] && S.tagById[t].source === "playlist");
    out = out.filter((t) => t !== "unfiled");
    if (!hasPlaylist) out.push("unfiled");
    return out;
  }

  function mergeRefs(v) {
    const rule = S.manual.refs[v.id] || {};
    const rm = rule.remove || [], ad = rule.add || [];
    let out = (v.autoRefs || []).filter((r) => rm.indexOf(r.to) < 0).slice();
    const seen = new Set(out.map((r) => r.to));
    ad.forEach((r) => {
      if (r.to === v.id || seen.has(r.to) || !S.byId[r.to]) return;
      out.push({ to: r.to, n: S.byId[r.to].n, type: r.type || "mention", note: r.note || "" });
      seen.add(r.to);

    out.sort((a, b) => a.n - b.n);

  // 可见内容的真实高度：绝对定位的 SVG 会撑大 scrollHeight，不能拿它当基准
  function listContentHeight() {

    S.videos.forEach((v) => {
      const r = S.rows[v.id];
      if (r && !r.classList.contains("hidden")) h = Math.max(h, r.offsetTop + r.offsetHeight);
    });
    return h;
  }

  // 把一份 manual 装载进来并整体重绘（用于运行时拉取线上版本）
  function adoptManual(obj) {
    S.manual = Object.assign(emptyManual(), obj || {});
    recompute();
    paintRows();
    renderTags();
    refreshDirty();
    applyFilter();
    if (IS_DEV) renderPending();
  }

  function stripManual(m) {
    const o = Object.assign({}, m || {});
    delete o._savedAt;
    delete o._comment;
    delete o._schema;
    return JSON.stringify(o);
  }

  // 运行时拉取仓库里的 data/manual.json；失败（file:// 或离线）就沿用内嵌副本
  async function hydrateManual() {
    if (!/^https?:$/.test(location.protocol)) return;
    let remote = null;
    try {
      const r = await fetch("data/manual.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      remote = await r.json();
    } catch (e) {
      return;
    }
    if (!remote || typeof remote !== "object") return;

    const hasLocalEdits = IS_DEV && hasLocal() && stripManual(remote) !== stripManual(S.manual);

      S.remoteDiffers = true;

  /* ---------------- 本地持久化 ---------------- */
  let storageOK = true;
  let storageWarned = false;

  function persist() {

      .map((n) => String(n).padStart(2, "0")).join(":");

  function markSaved() { updateSaveState(); }

  function updateSaveState() {
    if (!IS_DEV) return;
    const box = $("#saveState");
    const np = document.querySelector(".np-status");

    const auto = autoSyncOn();
    let txt, cls = "savestate";
    if (!storageOK) { txt = "本地存储不可用"; cls += " err"; }
    else if (syncing) { txt = "同步中…"; cls += " warn"; }
    else if (S.syncError) { txt = "同步失败 · 仅存本地（" + S.syncError + "）"; cls += " err"; }
    else if (S.pendingSync && auto) { txt = "待同步…"; cls += " warn"; }
    else if (S.pendingSync && !auto) { txt = "仅存本机 · 未启用同步"; cls += " warn"; }

  function warnStorage() {

      "排序：发布日期从新到旧 · 共 " + S.videos.length + " 个公开视频 · 生成于 " + DATA.generatedAt;
    $("#footnote").textContent = IS_DEV
      ? "开发版：点行内空白处写笔记，点「编辑」改标签与引用；改动暂存本地，导出后固化"

  /* ---------------- list ---------------- */

    S.rows = {}; S.years = [];

    S.videos.forEach((v) => {

  function paintRows() {

      const cols = v.tags.map((t) => (S.tagById[t] ? S.tagById[t].color : "#5a626e"));
      const stripe = row.querySelector(".stripe");
      if (!cols.length) {
        stripe.style.background = "transparent";

          cols.map((c, i) => c + " " + (i * step).toFixed(1) + "%," + c + " " + ((i + 1) * step).toFixed(1) + "%").join(",") + ")";
      }

      const cr = row.querySelector(".c-refs");
      cr.textContent = "";
      const mentions = mentionTargets(v);
      if (mentions.length) {

        b.dataset.from = v.id;
        if (mentions.length === 1) {
          const t = S.byId[mentions[0].to], r = mentions[0];
          const why = r.label ? "简介链接：" + r.label : "明确引用：";
          b.title = why + "\n→ " + t.title + "（" + t.date + "）\n点击高亮并连线";
        } else {
          const lines = mentions.slice(0, 4).map((r) => "· " + S.byId[r.to].title).join("\n");
          const more = mentions.length > 4 ? "\n… 共 " + mentions.length + " 个" : "";
          b.title = "明确引用 " + mentions.length + " 个视频\n" + lines + more + "\n点击一并高亮并连线";
        }

        b.onclick = (ev) => { ev.stopPropagation(); toggleSource(v.id); };
        cr.appendChild(b);
      }

        const pen = el("button", "penbtn", "编辑");
        pen.title = "改标签与引用";
        pen.onclick = (ev) => { ev.stopPropagation(); toggleEditor(v.id); };
        cr.appendChild(pen);

      row.classList.toggle("has-note", !!v.note);
      const cn = row.querySelector(".c-note");
      if (cn) {
        const show = v.note && S.openNote !== v.id;

        cn.onclick = show && !IS_DEV
          ? (e) => { e.stopPropagation(); cn.classList.toggle("open"); }
          : null;

  /* ---------------- filtering ---------------- */
  function matches(v) {
    if (S.search && v.title.toLowerCase().indexOf(S.search) < 0) return false;
    if (!S.sel.size) return true;
    return v.tags.some((t) => S.sel.has(t));
  }

  function applyFilter() {
    const forced = new Set();
    S.active.forEach((id) => (S.byId[id] ? mentionTargets(S.byId[id]) : []).forEach((r) => forced.add(r.to)));
    const yearOn = {};
    let shown = 0;
    S.videos.forEach((v) => {
      const ok = matches(v);
      // 选目标时源行必须留在视野里，否则筛选会把面板一起藏掉
      const pinned = !!(S.pick && S.pick.from === v.id);
      const show = ok || forced.has(v.id) || pinned;
      const row = S.rows[v.id];
      row.classList.toggle("hidden", !show);
      row.classList.toggle("is-temp", show && !ok);
      if (show) { shown++; yearOn[v.date.slice(0, 4)] = true; }
